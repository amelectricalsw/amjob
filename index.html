<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AM Job</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#111111">
<style>body{font-family:system-ui,sans-serif;margin:0;padding:16px;max-width:560px;margin:auto;color:#111}img{display:block;margin:0 auto;max-width:280px;width:100%}h1{text-align:center;font-size:17px}label{display:block;margin:16px 0 6px;font-size:15px}input,textarea{width:100%;box-sizing:border-box;font-size:18px;padding:14px;border:1px solid #bbb;border-radius:10px}.seg{display:flex;gap:8px;margin-top:16px}.seg label{flex:1;margin:0;text-align:center;padding:14px;border:2px solid #111;border-radius:10px}.seg input{display:none}.seg input:checked+span{font-weight:700}button{width:100%;min-height:64px;font-size:20px;font-weight:700;background:#111;color:#fff;border:0;border-radius:12px;margin-top:24px}.note{font-size:13px;color:#555}</style></head><body>
<img src="logo.png" alt="AM Electrical (SW) Ltd"><h1>Job ready for invoicing</h1><p class="note">* = must be filled in. All amounts ex VAT.</p>
<form action="https://formsubmit.co/amelectricalswltd@outlook.com" method="POST">
<input type="hidden" name="_subject" id="subj" value="New job for invoicing"><input type="hidden" name="_template" value="table"><input type="hidden" name="_captcha" value="false"><input type="hidden" name="_next" value="https://amelectricalsw.github.io/amjob/thanks.html">
<label>Customer name *<input name="Customer name" required></label>
<label>Customer address<input name="Customer address" placeholder="Not needed for a repeat customer"></label>
<label>Postcode<input name="Postcode" placeholder="Not needed for a repeat customer"></label>
<label>Customer email (new customers only)<input type="email" name="Customer email"></label>
<label>Customer phone<input type="tel" name="Customer phone"></label>
<label>Job address (if different)<input name="Job address" placeholder="Not needed for a repeat customer"></label>
<label>Job postcode (if different)<input name="Job postcode" placeholder="Not needed for a repeat customer"></label>
<label>Job date<input type="date" name="Job date"></label>
<label>Job description *<textarea name="Job description" rows="5" required></textarea></label>
<div class="seg"><label><input type="radio" name="Pricing" value="Total" checked onchange="m()"><span>Total amount</span></label><label><input type="radio" name="Pricing" value="Labour + Materials" onchange="m()"><span>Labour + Materials</span></label></div>
<div id="t"><label>Total amount £ (ex VAT) *<input name="Total ex VAT" inputmode="decimal" required></label></div>
<div id="s" hidden><label>Labour cost £ (ex VAT) *<input name="Labour ex VAT" inputmode="decimal"></label><label>Material cost £ (ex VAT) *<input name="Materials ex VAT" inputmode="decimal"></label></div>
<button>Submit</button></form>
<script>document.forms[0].addEventListener("submit",function(){subj.value="New job for invoicing - "+document.querySelector("[name=\"Customer name\"]").value});function m(){var s=document.querySelector('input[value="Total"]').checked;t.hidden=!s;window.s.hidden=s;t.querySelector('input').required=s;window.s.querySelectorAll('input').forEach(function(i){i.required=!s})}</script>
</body></html>
