<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AM Booking</title><link rel="icon" href="../icon-192.png"><link rel="apple-touch-icon" href="../icon-180.png"><meta name="theme-color" content="#111111">
<style>body{font-family:system-ui,sans-serif;margin:0;padding:16px;max-width:560px;margin:auto;color:#111}img{display:block;margin:0 auto;max-width:280px;width:100%}h1{text-align:center;font-size:17px}label{display:block;margin:16px 0 6px;font-size:15px}input,textarea,select{width:100%;box-sizing:border-box;font-size:18px;padding:14px;border:1px solid #bbb;border-radius:10px;background:#fff}.seg{display:flex;gap:8px;margin-top:6px}.seg label{flex:1;margin:0;text-align:center;padding:14px;border:2px solid #111;border-radius:10px}.seg input{display:none}.seg label:has(input:checked){background:#111;color:#fff;font-weight:700}button{width:100%;min-height:64px;font-size:20px;font-weight:700;background:#111;color:#fff;border:0;border-radius:12px;margin-top:24px}.note{font-size:13px;color:#555}.lnk{display:block;text-align:center;margin:20px 0;font-size:16px;color:#111}</style></head><body>
<img src="../logo.png" alt="AM Electrical (SW) Ltd"><h1>Book in a job</h1><p class="note">* = must be filled in.</p>
<form action="https://api.web3forms.com/submit" method="POST"><input type="hidden" name="access_key" value="837433c2-c76f-4a66-9fac-d184d7245a86"><input type="hidden" name="subject" id="subj" value="New booking"><input type="hidden" name="from_name" value="AM Booking form"><input type="hidden" name="redirect" value="https://amelectricalsw.github.io/amjob/booking/thanks.html">
<label>Customer name *<input name="Customer name" required></label>
<label>Job address *<input name="Job address" required></label>
<label>Phone<input type="tel" name="Phone"></label>
<label>Job description *<textarea name="Job description" rows="4" required></textarea></label>
<label>Date *<input type="date" name="Date" required></label>
<label>Start time<input type="time" name="Start time"></label>
<label>How long<select name="How long"><option value="">Not sure</option><option>1-2 hours</option><option>Half day</option><option>Full day</option><option>Multi-day</option></select></label>
<label>Who's doing it *</label><div class="seg"><label><input type="radio" name="Who" value="Tom" required><span>Tom</span></label><label><input type="radio" name="Who" value="Ben"><span>Ben</span></label><label><input type="radio" name="Who" value="Both"><span>Both</span></label></div>
<button>Book job</button></form>
<a class="lnk" href="../">Job finished? Send it for invoicing →</a>
<script>document.forms[0].addEventListener("submit",function(){subj.value="New booking - "+document.querySelector("[name=\"Customer name\"]").value})</script>
</body></html>
